<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CalcPlus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3f4fb">
<meta name="description" content="CalcPlus: calculator, currency, VAT, percentages, margin, trip cost, savings, gold, Hijri date, zakat and more in 10 languages.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4fb;--card:#ffffff;--txt:#14161a;--mut:#6b7280;--line:#e3e5f0;
  --key:#ffffff;--keyfn:#e6e8f2;--acc:#6366f1;--acc2:#a855f7;--grad:linear-gradient(135deg,#6366f1,#a855f7);--acct:#ffffff;--shadow:0 1px 3px rgba(30,30,80,.08);
  --good:#16a34a;--warn:#d97706;--bad:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090a10;--card:#14161e;--txt:#f3f4f8;--mut:#8f95a8;--line:#242736;
    --key:#171a24;--keyfn:#262a3a;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#090a10;--card:#14161e;--txt:#f3f4f8;--mut:#8f95a8;--line:#242736;
  --key:#171a24;--keyfn:#262a3a;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 55% at 50% 0%,color-mix(in srgb,var(--acc) 20%,var(--bg)),var(--bg) 70%) fixed,var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans SC","Noto Sans Devanagari",sans-serif;
  display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header div{display:flex;gap:6px}
.ib{border:0;background:var(--card);color:var(--txt);width:42px;height:42px;border-radius:12px;font-size:20px;box-shadow:var(--shadow);cursor:pointer}
main{flex:1;overflow-y:auto;padding:6px 14px 14px;-webkit-overflow-scrolling:touch}
nav{display:flex;gap:2px;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{position:relative;flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--mut);padding:6px 2px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{color:var(--acc);font-weight:600}
nav button.on::after{content:"";position:absolute;bottom:2px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:3px;background:var(--grad)}

/* calculator */
.disp{position:relative;background:transparent;border-radius:18px;padding:10px 6px 8px;margin-bottom:6px;direction:ltr;text-align:right;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.expr{color:var(--mut);font-size:22px;min-height:30px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.res{font-size:56px;font-weight:600;overflow-x:auto;white-space:nowrap;scrollbar-width:none;cursor:pointer;letter-spacing:-1px}
.tools{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;direction:ltr}
.tools button{border:0;background:var(--keyfn);color:var(--mut);border-radius:999px;padding:9px 0;font-size:12px;font-weight:600;cursor:pointer}
.tools button.on{background:color-mix(in srgb,var(--acc) 22%,var(--keyfn));color:var(--acc)}
.stabs{display:flex;gap:6px;margin-bottom:8px;direction:ltr}
.stabs button{flex:1;border:0;border-radius:999px;padding:7px 0;background:transparent;color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line)}
.stabs button.on{background:var(--acc);border-color:var(--acc);color:var(--acct)}
.sci{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;direction:ltr}
.sci[hidden]{display:none}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
.k{border:0;border-radius:24px;background:var(--key);color:var(--txt);font-size:28px;font-weight:500;height:clamp(54px,9vh,76px);box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .05s}
.k:active{transform:scale(.94);filter:brightness(.9)}
.k.sm{height:42px;font-size:15px;border-radius:14px;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--key))}
.k.fn{background:var(--keyfn);font-size:22px;color:var(--txt)}
.k.op{background:color-mix(in srgb,var(--acc) 16%,var(--key));color:var(--acc);font-size:32px;font-weight:600}
.k.eq{background:var(--grad);color:var(--acct);font-size:32px;font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 45%,transparent)}

/* tools */
.f{display:block;margin:0 0 10px}
.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=number],input[type=search],input[type=text],input[type=date],select{width:100%;padding:12px 14px;font-size:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:0}
.two{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.sw{border:0;background:var(--keyfn);color:var(--txt);width:44px;height:48px;border-radius:12px;font-size:20px;margin-bottom:10px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--keyfn);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--txt);padding:10px 6px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:8px 14px;border-radius:999px;font-size:15px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acct)}
.out{margin-top:6px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);padding:14px 16px;border-radius:18px;margin-bottom:8px;box-shadow:var(--shadow)}
.orow span{color:var(--mut);font-size:14px}
.orow b{font-size:20px;font-weight:600;text-align:end;word-break:break-all;cursor:pointer}
.orow.big{background:var(--grad);color:var(--acct)}
.orow.big span{color:rgba(255,255,255,.85)}
.orow.big b{font-size:26px}
.orow.err{color:var(--bad);justify-content:center}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px!important}
.pill{display:inline-block;padding:8px 16px;border-radius:999px;font-weight:600;color:#fff}
.pill.good{background:var(--good)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}
.note{color:var(--mut);font-size:13px;margin:8px 2px}
.note a{color:var(--acc)}
.btn{width:100%;border:0;background:var(--grad);color:var(--acct);padding:13px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.shr{position:absolute;left:2px;top:6px;border:0;background:var(--keyfn);color:var(--mut);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.swatches button{width:44px;height:36px;border-radius:12px;border:3px solid transparent;cursor:pointer;padding:0}
.swatches button.on{border-color:var(--txt)}
.btn.sec{background:var(--keyfn);color:var(--txt)}
.btn.dng{background:var(--bad);margin-top:12px}

[hidden]{display:none!important}
.ttl{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 8px;min-height:96px;border:0;border-radius:16px;background:var(--card);color:var(--txt);box-shadow:var(--shadow);font:inherit;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.card i{font-style:normal;font-size:30px;line-height:1}
.card:active{transform:scale(.97)}
.srch{margin:2px 0 12px}
.srch input{border-radius:16px;padding:14px 16px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--txt);font:inherit;font-size:17px;font-weight:600;text-align:start;cursor:pointer;box-shadow:var(--shadow)}
.row:active{transform:scale(.985)}
.row .ico{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:22px;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.row span{flex:1}
.row em{font-style:normal;color:var(--mut);font-size:24px;line-height:1}
[dir=rtl] .row em{transform:scaleX(-1)}
.empty{color:var(--mut);text-align:center;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{font-weight:700;margin:6px 2px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:85vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet header{padding:14px 16px 8px}
#modalBody{overflow-y:auto;padding:4px 16px 16px}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);padding:10px 14px;border-radius:14px;margin-bottom:8px;cursor:pointer}
.h div{min-width:0;direction:ltr;text-align:left}
.h small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h b{font-size:20px}
.h button{border:0;background:var(--keyfn);color:var(--txt);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
#toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
main:has(#sci:not([hidden])) .pad .k{height:clamp(42px,6.6vh,58px);font-size:24px;border-radius:18px}
main:has(#sci:not([hidden])) .disp{min-height:96px}
main:has(#sci:not([hidden])) .res{font-size:44px}
@media (max-height:640px){.res{font-size:36px}.disp{min-height:84px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><button class="ib" id="backBtn" hidden>←</button><h1 id="title">CalcPlus</h1></div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modal" hidden>
  <div class="sheet">
    <header><h1 id="modalTitle"></h1><button class="ib" id="modalClose" aria-label="close">✕</button></header>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>
<noscript>Please enable JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
