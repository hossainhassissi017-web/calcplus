<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CalcPlus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f5f7">
<meta name="description" content="CalcPlus: calculator, currency, VAT, percentages, margin, trip cost, savings, gold, Hijri date, zakat and more in 10 languages.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--txt:#14161a;--mut:#6b7280;--line:#e5e7eb;
  --key:#ffffff;--keyfn:#e3e6ea;--acc:#ff9500;--acct:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.08);
  --good:#16a34a;--warn:#d97706;--bad:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--card:#1a1d23;--txt:#f3f4f6;--mut:#9ca3af;--line:#2a2e36;
    --key:#262a32;--keyfn:#363b45;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#1a1d23;--txt:#f3f4f6;--mut:#9ca3af;--line:#2a2e36;
  --key:#262a32;--keyfn:#363b45;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans SC","Noto Sans Devanagari",sans-serif;
  display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
header h1{font-size:20px;margin:0;font-weight:700}
header div{display:flex;gap:6px}
.ib{border:0;background:var(--card);color:var(--txt);width:42px;height:42px;border-radius:12px;font-size:20px;box-shadow:var(--shadow);cursor:pointer}
main{flex:1;overflow-y:auto;padding:6px 14px 14px;-webkit-overflow-scrolling:touch}
nav{display:flex;overflow-x:auto;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--mut);padding:6px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--txt);font-weight:600}

/* calculator */
.disp{position:relative;background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:8px;box-shadow:var(--shadow);direction:ltr;text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end}
.expr{color:var(--mut);font-size:20px;min-height:26px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.res{font-size:44px;font-weight:600;overflow-x:auto;white-space:nowrap;scrollbar-width:none;cursor:pointer;letter-spacing:-.5px}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px;direction:ltr}
.tools button{border:0;background:var(--keyfn);color:var(--txt);border-radius:10px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer}
.tools button.on{background:var(--acc);color:var(--acct)}
.sci{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px;direction:ltr}
.sci[hidden]{display:none}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.k{border:0;border-radius:18px;background:var(--key);color:var(--txt);font-size:26px;height:clamp(52px,9vh,74px);box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .05s}
.k:active{transform:scale(.95);filter:brightness(.92)}
.k.sm{height:42px;font-size:15px;border-radius:12px}
.k.fn{background:var(--keyfn);font-size:22px}
.k.op{background:color-mix(in srgb,var(--acc) 22%,var(--key));color:var(--acc);font-size:30px;font-weight:600}
.k.eq{background:var(--acc);color:var(--acct);font-size:30px;font-weight:600}

/* tools */
.f{display:block;margin:0 0 10px}
.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=number],input[type=text],input[type=date],select{width:100%;padding:12px 14px;font-size:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:0}
.two{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.sw{border:0;background:var(--keyfn);color:var(--txt);width:44px;height:48px;border-radius:12px;font-size:20px;margin-bottom:10px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--keyfn);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--txt);padding:10px 6px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:8px 14px;border-radius:999px;font-size:15px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acct)}
.out{margin-top:6px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);padding:14px 16px;border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.orow span{color:var(--mut);font-size:14px}
.orow b{font-size:20px;font-weight:600;text-align:end;word-break:break-all;cursor:pointer}
.orow.big{background:var(--acc);color:var(--acct)}
.orow.big span{color:rgba(255,255,255,.85)}
.orow.big b{font-size:26px}
.orow.err{color:var(--bad);justify-content:center}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px!important}
.pill{display:inline-block;padding:8px 16px;border-radius:999px;font-weight:600;color:#fff}
.pill.good{background:var(--good)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}
.note{color:var(--mut);font-size:13px;margin:8px 2px}
.note a{color:var(--acc)}
.btn{width:100%;border:0;background:var(--acc);color:var(--acct);padding:13px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.shr{position:absolute;left:8px;top:8px;border:0;background:var(--keyfn);color:var(--txt);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swatches button.on{border-color:var(--txt)}
.btn.sec{background:var(--keyfn);color:var(--txt)}
.btn.dng{background:var(--bad);margin-top:12px}

[hidden]{display:none!important}
.ttl{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 8px;min-height:96px;border:0;border-radius:16px;background:var(--card);color:var(--txt);box-shadow:var(--shadow);font:inherit;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.card i{font-style:normal;font-size:30px;line-height:1}
.card:active{transform:scale(.97)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{font-weight:700;margin:6px 2px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:85vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet header{padding:14px 16px 8px}
#modalBody{overflow-y:auto;padding:4px 16px 16px}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);padding:10px 14px;border-radius:14px;margin-bottom:8px;cursor:pointer}
.h div{min-width:0;direction:ltr;text-align:left}
.h small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h b{font-size:20px}
.h button{border:0;background:var(--keyfn);color:var(--txt);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
#toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
@media (max-height:640px){.res{font-size:36px}.disp{min-height:84px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><button class="ib" id="backBtn" hidden>←</button><h1 id="title">CalcPlus</h1></div>
    <div>
      <button class="ib" id="histBtn">🕘</button>
      <button class="ib" id="settBtn">⚙️</button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modal" hidden>
  <div class="sheet">
    <header><h1 id="modalTitle"></h1><button class="ib" id="modalClose" aria-label="close">✕</button></header>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>
<noscript>Please enable JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
